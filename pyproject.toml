[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emailrisk"
version = "1.0.0"
description = "Static phishing and spoofing risk analyzer for emails (headers, links, language, attachments)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]

[project.scripts]
emailrisk = "emailrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
